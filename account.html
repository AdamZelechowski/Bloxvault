<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Account - BloxVault</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar px-3" id="topNav" hidden>
    <a class="navbar-brand fw-bold" href="index.html">BloxVault</a>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-light" id="navHome">Home</button>
      <button class="btn btn-sm btn-outline-light" id="navAdmin" hidden>Admin</button>
      <button class="btn btn-sm btn-outline-light" id="navLogout">Log out</button>
    </div>
  </nav>

  <main class="container py-4">
    <p id="loading" class="text-center text-secondary">Loading…</p>

    <section id="auth" class="mx-auto narrow" hidden>
      <div class="card p-4">
        <h1 class="h4 text-center mb-1">Your account</h1>
        <p class="text-center small mb-3"><a href="index.html">Back to the toolbox</a></p>
        <div class="btn-group w-100 mb-3">
          <button type="button" class="btn btn-outline-light active" id="loginTab">Log in</button>
          <button type="button" class="btn btn-outline-light" id="registerTab">Register</button>
        </div>

        <form id="loginForm" class="vstack gap-3">
          <input id="loginEmail" type="email" class="form-control" placeholder="Email" aria-label="Email" autocomplete="username" required>
          <input id="loginPassword" type="password" class="form-control" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
          <button class="btn btn-primary">Log in</button>
          <button type="button" class="btn btn-link p-0" id="forgotBtn">Forgot password?</button>
        </form>

        <form id="registerForm" class="vstack gap-3" hidden>
          <input id="regName" type="text" class="form-control" placeholder="Display name (optional)" aria-label="Display name" maxlength="30" autocomplete="nickname">
          <input id="regEmail" type="email" class="form-control" placeholder="Email" aria-label="Email" autocomplete="username" required>
          <input id="regPassword" type="password" class="form-control" placeholder="Password (8+ characters)" aria-label="Password" minlength="8" autocomplete="new-password" required>
          <input id="regConfirm" type="password" class="form-control" placeholder="Confirm password" aria-label="Confirm password" autocomplete="new-password" required>
          <button class="btn btn-primary">Create account</button>
        </form>

        <div class="text-center text-secondary my-3">or</div>
        <button type="button" class="btn btn-outline-light w-100" id="googleBtn">Continue with Google</button>
        <div id="authMsg" hidden></div>
      </div>
    </section>

    <section id="dashboard" hidden>
      <h1 class="h3 mb-3">Welcome, <span id="welcomeName"></span></h1>
      <div id="verifyNote" class="alert alert-warning" hidden>Verify your email: check your inbox for the link.</div>
      <div class="card p-4 mb-3">
        <h2 class="h5">Your profile</h2>
        <dl class="row mb-3">
          <dt class="col-sm-3">Email</dt><dd class="col-sm-9" id="profileEmail"></dd>
          <dt class="col-sm-3">Joined</dt><dd class="col-sm-9" id="profileJoined"></dd>
          <dt class="col-sm-3">Last login</dt><dd class="col-sm-9" id="profileLast"></dd>
        </dl>
        <form id="nameForm" class="input-group">
          <input id="nameInput" class="form-control" placeholder="Display name" aria-label="Display name" maxlength="30">
          <button class="btn btn-primary">Save name</button>
        </form>
        <div id="profileMsg" hidden></div>
      </div>
      <div class="card p-4">
        <h2 class="h5">Toolbox</h2>
        <p class="mb-0"><a href="index.html">Open the toolbox</a></p>
      </div>
    </section>

    <section id="admin" hidden>
      <h1 class="h3 mb-3">Admin</h1>
      <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
        <span>Users: <strong id="userCount">0</strong></span>
        <input id="userFilter" class="form-control w-auto" placeholder="Filter by email" aria-label="Filter by email">
      </div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead><tr><th>Email</th><th>Name</th><th>Provider</th><th>Joined</th><th>Last login</th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
      <div id="adminMsg" hidden></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
